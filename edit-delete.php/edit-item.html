<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item | Inventory Management System</title>
    <link rel="stylesheet" href="items.css">
</head>
<body class="items-page">

    <main>
        <h1>Edit Item</h1>

        <form id="editForm">

            <input type="hidden" id="itemId">

            <label>Item Name:</label>
            <input type="text" id="itemName" required>

            <br><br>

            <label>Category:</label>
            <select id="category" required>
                <option value="Bakery">Bakery</option>
                <option value="Beverages">Beverages</option>
                <option value="Dairy">Dairy</option>
                <option value="Household">Household</option>
                <option value="Pantry">Pantry</option>
            </select>

            <br><br>

            <label>Price:</label>
            <input type="number" id="price" min="0" step="0.01" required>

            <br><br>

            <label>Quantity:</label>
            <input type="number" id="quantity" min="0" step="1" required>

            <br><br>

            <label>Restock Level:</label>
            <input type="number" id="restockLevel" min="0" step="1" required>

            <br><br>

            <button type="submit">Save Changes</button>
            

        </form>
    </main>

    <script src="script.js"></script>

</body>
</html>
