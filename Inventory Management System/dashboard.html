
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Inventory Dashboard</title>

</head>


<body>

    <h1>Inventory Dashboard</h1>

    <div class="dashboard">

        <!-- total items -->
        <div class="card">
            <h3>Total Items</h3>
            <h2 class="total" id="totalItems">0</h2>
        </div>

        <!-- low stock -->
        <div class="card">
            <h3>Low Stock Count</h3>
            <h2 class="low" id="lowStock">0</h2>
        </div>

        <div class="card">
            <h1>Inventory Infomation</h1>
            
            <table border="1" cellpadding="10">
        <tr>
            <th>Item</th>
            <th>Category</th>
            <th>Quantity</th>
        </tr>
        <tbody id="inventoryTable"></tbody>
    </table>

        </div>

    </div>

    <script>

        // Inventory
        let inventory = [
            { name: "item1", category: "N/A", quantity: 3 },
            { name: "item2", category: "N/A", quantity: 2 },
            { name: "item3", category: "N/A", quantity: 5 },
            { name: "item4", category: "N/A", quantity: 4 },
            { name: "item5", category: "N/A", quantity: 3 },
            { name: "item6", category: "N/A", quantity: 1 }
        ];

        // Number of total items
        let totalItems = inventory.length;

        // Numbe of low stock
        let lowStock = inventory.filter(
            item => item.quantity <= 5 && item.quantity > 0
        ).length;

        // Display Results
        document.getElementById("totalItems").innerText = totalItems;

        document.getElementById("lowStock").innerText = lowStock;

        inventory.forEach(item => {
            document.getElementById("inventoryTable").innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.category}</td>
                    <td>${item.quantity}</td>
                </tr>
            `;
        });
    </script>

</body>
</html>
